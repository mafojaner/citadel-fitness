name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs even if lint failed, so a formatting nit doesn't hide a real
      # test failure behind it — you get both results from one push.
      - name: Test
        if: '!cancelled()'
        run: npm test -- --ci
